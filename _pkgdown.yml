url: https://polymerase3.github.io/phiper/
home:
  title: phiper - Automated PhIP-seq Analysis and Reporting
authors:
  Mateusz Franciszek Kolek: https://github.com/Polymerase3
template:
  bootstrap: 5
  math-rendering: mathjax
  light-switch: true
  bslib:
    primary: "#0054AD"
    border-radius: 0.5rem
    btn-border-radius: 0.25rem
    danger: "#A6081A"

navbar:
  structure:
    left: [reference, articles, peptide-library, news]
  components:
    peptide-library:
      text: "Peptide library"
      menu:
        - text: "Agilent, Twist & Corona2"
          href: articles/peptide-library.html
        - text: "ICAM"
          href: articles/peptide-library-icam.html
        - text: "Human proteome"
          href: articles/peptide-library-human-proteome.html

reference:
  - title: "Alpha diversity"
    contents:
      - compute_alpha
      - compute_alpha_significance
      - plot_alpha
      - plot_alpha_interactive
      - plot_alpha_significance
      - plot_enrichment_counts
  - title: "Beta diversity"
    contents:
      - compute_distance
      - compute_pcoa
      - compute_pcoa_feature_associations
      - compute_capscale
      - compute_permanova
      - compute_dispersion
      - compute_tsne
      - plot_pcoa
      - plot_scree
      - plot_cap
      - plot_dispersion
      - plot_tsne
  - title: "POP analysis"
    contents:
      - compute_pop
      - scatter_static
      - scatter_interactive
      - volcano_static
      - volcano_interactive
  - title: "Delta analysis"
    contents:
      - compute_delta
      - deltaplot
      - deltaplot_interactive
      - forestplot
      - forestplot_interactive
      - ecdf_plot
      - ecdf_plot_interactive
  - title: "Plot styling"
    contents:
      - theme_phip
      - phip_palette
      - scale_colour_phip
      - scale_fill_phip
  - title: "Example data"
    contents:
      - load_example_data
      - get_example_path

articles:
  - title: "Get started"
    navbar: "Get started"
    contents:
      - typical-workflow
  - title: "Module vignettes"
    navbar: "Module vignettes"
    contents:
      - alpha-diversity
      - beta-diversity
      - pop-analysis
      - delta-analysis
  - title: "Peptide library"
    navbar: "Peptide library"
    contents:
      - peptide-library
      - peptide-library-icam
      - peptide-library-human-proteome
